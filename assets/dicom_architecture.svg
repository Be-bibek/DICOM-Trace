  <rect x="420" y="106" width="110" height="30" rx="5" fill="#00b4d8" opacity="0.2" stroke="#00b4d8" stroke-width="1"/>
  <text x="475" y="126" text-anchor="middle" fill="#90e0ef" font-size="9">🔊 Ultrasound .dcm</text>

  <rect x="544" y="106" width="140" height="30" rx="5" fill="#00b4d8" opacity="0.2" stroke="#00b4d8" stroke-width="1"/>
