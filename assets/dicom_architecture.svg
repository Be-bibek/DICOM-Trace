  <text x="450" y="56" text-anchor="middle" fill="#90e0ef" font-size="10">Behavior-Entangled Watermarking for Medical Image Integrity</text>

  <!-- ─── Layer 1: Medical Imaging Input ─── -->
  <rect x="30" y="78" width="840" height="70" rx="8" fill="#0a1628" stroke="#00b4d8" stroke-width="1" opacity="0.8"/>
  <text x="48" y="98" fill="#00b4d8" font-size="10" font-weight="bold">MEDICAL IMAGING INPUT LAYER</text>

  <!-- Input boxes -->
  <rect x="48" y="106" width="110" height="30" rx="5" fill="#00b4d8" opacity="0.2" stroke="#00b4d8" stroke-width="1"/>
