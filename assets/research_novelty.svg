<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="JetBrains Mono, monospace">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="440" fill="url(#bg2)" rx="14"/>
  <rect width="900" height="440" fill="none" stroke="#00b4d8" stroke-width="1.5" rx="14" opacity="0.4"/>

  <text x="450" y="34" text-anchor="middle" fill="#00b4d8" font-size="16" font-weight="bold" filter="url(#glow2)">Research Novelty Assessment — DICOM-Trace</text>
  <text x="450" y="52" text-anchor="middle" fill="#90e0ef" font-size="10">IEEE Contribution Positioning vs. Existing Medical Watermarking Approaches</text>

  <!-- Y-axis label -->
  <text x="22" y="260" text-anchor="middle" fill="#aaa" font-size="10" transform="rotate(-90 22 260)">Innovation Score (0–100)</text>

  <!-- Grid lines -->
  <line x1="80" y1="80" x2="870" y2="80" stroke="#1a2a3a" stroke-width="1"/>
  <line x1="80" y1="140" x2="870" y2="140" stroke="#1a2a3a" stroke-width="1"/>
  <line x1="80" y1="200" x2="870" y2="200" stroke="#1a2a3a" stroke-width="1"/>
  <line x1="80" y1="260" x2="870" y2="260" stroke="#1a2a3a" stroke-width="1"/>
  <line x1="80" y1="320" x2="870" y2="320" stroke="#1a2a3a" stroke-width="1"/>
  <line x1="80" y1="380" x2="870" y2="380" stroke="#1a2a3a" stroke-width="1"/>

  <!-- Y labels -->
  <text x="72" y="84" text-anchor="end" fill="#aaa" font-size="9">100</text>
  <text x="72" y="144" text-anchor="end" fill="#aaa" font-size="9">80</text>
  <text x="72" y="204" text-anchor="end" fill="#aaa" font-size="9">60</text>
  <text x="72" y="264" text-anchor="end" fill="#aaa" font-size="9">40</text>
  <text x="72" y="324" text-anchor="end" fill="#aaa" font-size="9">20</text>
  <text x="72" y="384" text-anchor="end" fill="#aaa" font-size="9">0</text>

  <!-- Axis -->
  <line x1="80" y1="380" x2="870" y2="380" stroke="#334155" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="380" stroke="#334155" stroke-width="1.5"/>

  <!-- Categories on X -->
  <text x="175" y="410" text-anchor="middle" fill="#aaa" font-size="8.5">BEW Novelty</text>
  <text x="315" y="410" text-anchor="middle" fill="#aaa" font-size="8.5">Device Entropy</text>
  <text x="455" y="410" text-anchor="middle" fill="#aaa" font-size="8.5">Replay Defense</text>
  <text x="595" y="410" text-anchor="middle" fill="#aaa" font-size="8.5">Hash Chain</text>
  <text x="735" y="410" text-anchor="middle" fill="#aaa" font-size="8.5">HIPAA Audit</text>
  <text x="860" y="410" text-anchor="middle" fill="#aaa" font-size="8.5">AI Defense</text>

  <!-- Existing systems bars (dark blue, thin) -->
  <!-- BEW novelty: existing=20 -->
  <rect x="100" y="332" width="50" height="48" rx="3" fill="#0077b6" opacity="0.6"/>
  <!-- Device Entropy: existing=5 -->
  <rect x="240" y="368" width="50" height="12" rx="3" fill="#0077b6" opacity="0.6"/>
  <!-- Replay Defense: existing=30 -->
  <rect x="380" y="320" width="50" height="60" rx="3" fill="#0077b6" opacity="0.6"/>
  <!-- Hash Chain: existing=40 -->
  <rect x="520" y="308" width="50" height="72" rx="3" fill="#0077b6" opacity="0.6"/>
  <!-- HIPAA Audit: existing=25 -->
  <rect x="660" y="330" width="50" height="50" rx="3" fill="#0077b6" opacity="0.6"/>
  <!-- AI Defense: existing=10 -->
  <rect x="800" y="362" width="50" height="18" rx="3" fill="#0077b6" opacity="0.6"/>

  <!-- DICOM-Trace bars (bright cyan, wide) -->
  <!-- BEW novelty: 95 -->
  <rect x="155" y="86" width="50" height="294" rx="3" fill="#00b4d8" opacity="0.85" filter="url(#glow2)"/>
  <text x="180" y="82" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="bold">95</text>
  <!-- Device Entropy: 98 -->
  <rect x="295" y="82" width="50" height="298" rx="3" fill="#00b4d8" opacity="0.85" filter="url(#glow2)"/>
  <text x="320" y="78" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="bold">98 ⭐</text>
  <!-- Replay Defense: 91 -->
  <rect x="435" y="98" width="50" height="282" rx="3" fill="#00b4d8" opacity="0.85" filter="url(#glow2)"/>
  <text x="460" y="94" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="bold">91</text>
  <!-- Hash Chain: 88 -->
  <rect x="575" y="114" width="50" height="266" rx="3" fill="#00b4d8" opacity="0.85" filter="url(#glow2)"/>
  <text x="600" y="110" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="bold">88</text>
  <!-- HIPAA Audit: 93 -->
  <rect x="715" y="92" width="50" height="288" rx="3" fill="#00b4d8" opacity="0.85" filter="url(#glow2)"/>
  <text x="740" y="88" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="bold">93</text>
  <!-- AI Defense: 85 -->
  <rect x="835" y="128" width="50" height="252" rx="3" fill="#00b4d8" opacity="0.85" filter="url(#glow2)"/>
  <text x="860" y="124" text-anchor="middle" fill="#00b4d8" font-size="9" font-weight="bold">85</text>

  <!-- Legend -->
  <rect x="560" y="420" width="14" height="10" rx="2" fill="#0077b6" opacity="0.7"/>
  <text x="578" y="430" fill="#aaa" font-size="9">Existing Medical Watermarking</text>
  <rect x="720" y="420" width="14" height="10" rx="2" fill="#00b4d8" opacity="0.85"/>
  <text x="738" y="430" fill="#00b4d8" font-size="9">DICOM-Trace (This Work)</text>
</svg>
